name: macOS build and validation

on:
  push:
    branches: [main, feature/still-sample-packs]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: macos-15
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Git LFS hooks and fetch sample objects
        run: |
          git lfs install --local
          git lfs pull

      - name: Configure macOS Audio Unit
        run: cmake --preset macos-release

      - name: Build AU, Standalone, and DSP checks
        run: cmake --build --preset macos-release --parallel 4

      - name: Run automated validation
        run: ctest --preset macos-release

      - name: Validate Audio Unit registration
        run: |
          component="$GITHUB_WORKSPACE/out/build/macos-release/STILL_artefacts/Release/AU/STILL.component"
          destination="$HOME/Library/Audio/Plug-Ins/Components/STILL.component"
          mkdir -p "$(dirname "$destination")"
          ditto "$component" "$destination"
          # AudioComponentRegistrar may retain a stale scan result after installation.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -v aumu Stil JAKm
